
[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-fetcher"
version = "0.1.0"
description = "A robust asynchronous HTTP fetching library with bounded concurrency, retries, and structured logging."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "structlog>=24.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<5.0",
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
    "respx>=0.21,<1.0",
    "ruff>=0.5,<1.0",
    "twine>=5.1,<7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
async_fetcher = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=async_fetcher",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["async_fetcher"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true
